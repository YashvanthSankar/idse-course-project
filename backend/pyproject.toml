[project]
name = "auditor"
version = "0.1.0"
description = "THE AUDITOR - the Python brain of a noir data-detective game"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: fairness property tests over many seeds"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint.isort]
known-first-party = ["auditor"]
