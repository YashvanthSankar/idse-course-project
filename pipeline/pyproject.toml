[project]
name = "tareekh"
version = "0.1.0"
description = "How long Indian district-court cases take. The IDSE course pipeline project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=22.0.0",
    # pinned to the game backend's version so a saved model loads where it is served
    "scikit-learn==1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["tareekh"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
